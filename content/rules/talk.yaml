# What he overhears: the room talking among itself, a few lines at a time, written over the heads of
# the ones saying it as they say it (the Godot build: godot/game/talk.gd). Near enough and it's
# clear; further off, or over a full room, it's fainter; past earshot it isn't heard at all.
#
# Each conversation:
#   id      its name
#   when    when it can happen: the same criteria as barks.yaml, on the Ink's VARs (optional)
#   lines   in order, each "who: what they say". Who is one of the room's people by their id in
#           characters.yaml (and slippers_b, the woman from upstairs with Slippers), "table28" for
#           table 28 all at once, or "a" and "b" for strangers: whoever's sitting or standing
#           together beside the others in it, or, with nobody named, any two together.
#   then    laugh (they laugh at it) or clink (glasses together), after the last line (optional)
#
# One at a time, each once a night, never at the table he's at (that's the story's) and never over
# the story's own lines; the most specific that can happen goes first, then the nearest. Everyone in
# it has to be in the room, near enough to each other to be talking, and near enough to him to be
# heard, and he has to be able to see one of them.
#
# Once he's heard one through, a voice in his head can answer it: the barks event ears:<id>
# (content/rules/barks.yaml).
#
# All of these are Claude's drafts, each in its speaker's voice (bible/10_VOICES.md). HUTCH: rewrite
# any of them, cut them, or put your own in. Talk overheard in a bar is the thing you've heard more
# of than anyone. The game's text rules hold here too: no dashes, no ellipses; a sentence that
# trails off just stops.
#
# The edge (Hutch, 2026-11-20): the room talks the way a roadhouse does, crude, unfair, funny and
# sad, and nobody steps in to say so. Nothing here is glorified or condemned; it's said, and the
# room laughs or doesn't.

# ---------------------------------------------------------------- table 28

- id: t28_diesel
  lines:
    - team_jacket: A dollar ninety-one for diesel. That's Ottawa's hand in your pocket, that is.
    - scratch: It'll come down. It's due.
    - team_jacket: Due, he says! It's been due since Expo!
    - hearing_aid: What about Expo?
  then: laugh

- id: t28_mill
  lines:
    - cardigan: When the mill ran three shifts, you couldn't get a table in here on a Wednesday.
    - team_jacket: Couldn't get in the door! Dancers upstairs on Thursdays. Remember Candy?
    - scratch: Candy with the snake.
    - hearing_aid: Candy who?
    - cardigan: Her boy was in my daughter's class. He's a dentist now, on the mainland.
  then: laugh

- id: t28_eggs
  lines:
    - team_jacket: Back in the day you could smoke in here, drive home pissed and pinch the waitress. On a Wednesday!
    - scratch: You never pinched anybody.
    - team_jacket: I was married! I had a lot of time on my hands!
    - hearing_aid: Whose hands?
  then: laugh

- id: t28_new_kid
  when: [clock >= 1230]
  lines:
    - team_jacket: So. The new kid. What do we think?
    - scratch: He's big. Big's a good sign on a door.
    - team_jacket: Hair like a woman, though. Like Jesus on a calendar.
    - cardigan: He said good evening to me. I can't remember the last one who did.
    - team_jacket: Give him a week. A week, tops!

- id: t28_new_kid_good
  when: [clock >= 1230, rep_t28 >= 1]
  lines:
    - team_jacket: The new kid's all right. Isn't he? He's all right!
    - glasses: He's all right. He's a good, he's.
    - team_jacket: Somebody buy the big fella a drink. Not me. Somebody.
  then: laugh

- id: t28_new_kid_bad
  when: [clock >= 1230, rep_t28 <= -1]
  lines:
    - team_jacket: That one on the door. Not one of ours, that one.
    - scratch: I don't like his numbers.
    - team_jacket: Ten doormen since spring! The last one cried in the walk-in. Cried!
    - hearing_aid: In the walk-in clinic?

- id: t28_dennis
  when: [t28_rounds >= 4]
  lines:
    - glasses: My wife says to me, she says, Dennis. She says, you're.
    - team_jacket: We know what she says, Dennis. The whole island knows what she says.
    - scratch: The fella at Canadian Tire knows.
    - glasses: Thirty years. Thirty years, and she still.
  then: laugh

- id: t28_cant_say
  lines:
    - team_jacket: You can't say anything anymore. Not a thing. They'll have you on the news.
    - scratch: You say everything. You've said everything twice.
    - team_jacket: And look where it got me! Table 28!
  then: laugh

- id: t28_clinic
  lines:
    - team_jacket: Four hours at the walk-in. Half the room needed a translator, and so did the doctor!
    - scratch: You needed a translator. You were half cut.
    - team_jacket: Half cut in English, mind!
  then: laugh

- id: t28_blue
  when: [t28_rounds >= 4]
  lines:
    - scratch: Doc's got me on the little blue ones. Says no grapefruit with them.
    - team_jacket: Who's eating grapefruit at a time like that!
    - hearing_aid: I like a grapefruit.
    - cardigan: I take mine for the heart. My wife's been gone four years.

- id: t28_phones
  lines:
    - team_jacket: Look at them over there. Faces in the phone. A whole generation with a crick in its neck.
    - cardigan: My grandson tells me he's depressed. He's twelve.
    - scratch: Twelve's lucky.
    - cardigan: He doesn't think so.

- id: t28_toast
  when: [t28_rounds >= 5]
  lines:
    - team_jacket: To the Sov! And to the ones who aren't here to see it!
    - scratch: To Barry's liver!
    - table28: To Barry's liver!
  then: clink

- id: t28_last_of
  when: [clock >= 1380]
  lines:
    - cardigan: Do you ever think we're the last of something?
    - team_jacket: The last of the rye, at this rate. Another round over here!
  then: laugh

# ---------------------------------------------------------------- the pool table

- id: pool_double
  lines:
    - buddy: Yeah yeah, no, that's mine, you left me that, that's mine.
    - bigman: I left you that.
    - buddy: Twenty bucks. Listen. Listen. Double or nothing.
    - bigman: Rack 'em, bud.

- id: pool_quiet
  when: [clock >= 1260]
  lines:
    - buddy: You're quiet tonight. Am I talking too much? I'm talking too much.
    - bigman: Shoot your ball.
    - buddy: Yeah yeah. No. Shooting.

- id: pool_kayla
  lines:
    - buddy: Kayla from the Tim's liked my post. Bud. Kayla. She liked it.
    - bigman: She likes everybody's post.
    - buddy: She doesn't like yours.
    - bigman: I don't post.
  then: laugh

# ---------------------------------------------------------------- along the bar

- id: endbar_tide
  lines:
    - endbar: Another, if you would. The same as before.
    - bartender: Yep.
    - endbar: The tide is on the turn. One can hear it under the floor.
    - bartender: That's the cooler, hon.

- id: slippers_drip
  lines:
    - slippers: Room nine has had that drip since August. Since the long weekend.
    - slippers_b: You should tell Terry.
    - slippers: I told Terry. Terry tells the drip.
  then: laugh

- id: slippers_eleven
  lines:
    - slippers_b: The one in eleven has a girl up every night. Every night.
    - slippers: I hear them through the vent, dear. She's faking it.
    - slippers_b: How would you know?
    - slippers: Thirty-eight years married, dear. I'd know.
  then: laugh

- id: slippers_door
  when: [clock >= 1300]
  lines:
    - slippers: My husband would have had that door shut by nine. Nine, and not a minute after.
    - slippers_b: Your husband had a temper.
    - slippers: He had standards, dear. He also had a temper.

- id: slippers_wine
  lines:
    - slippers: Is this the same bottle as Tuesday, dear? It tastes like Tuesday.
    - bartender: Same box, sweetheart. Same Tuesday.

- id: card_machine
  lines:
    - a: Card machine working tonight?
    - bartender: Ask the fuckin' card machine, hon. It decides.

- id: hivis_room
  lines:
    - hivis: How's she goin'.
    - a: Can't complain. You on at the mill?
    - hivis: Contract. Six weeks. I'm in room eleven, so.
    - a: Upstairs here? Christ. Bring your own sheets.
    - hivis: Fair enough.

- id: goodshoes_gary
  lines:
    - goodshoes: Gary and I go back. I completely understand the caution, of course.
    - a: Sure.
    - goodshoes: He's a reasonable man, Gary. I'm a reasonable man.

# table 28 and the big TV over the back wall (content/ink/room.ink): the late news sets them off at
# half past eleven, unless the doorman's put something else on

- id: t28_news_light
  when: [t28_off > 0]
  lines:
    - team_jacket: Two nights! Same place! That's not a plane!
    - scratch: It's HAARP. They've got it pointed right at us.
    - hearing_aid: Seeding.
    - team_jacket: Seeding's for the hail! That's Alberta!

- id: t28_news_balloon
  when: [t28_off > 0]
  lines:
    - cardigan: My brother-in-law says the Air Force told the paper it's a balloon.
    - team_jacket: A balloon! What's it tied to?
    - scratch: That's exactly what they'd say.
  then: laugh

- id: t28_curling
  when: [tv_on == 4]
  lines:
    - team_jacket: Look at him sweep. Look at that.
    - hearing_aid: Who's winning?
    - scratch: He's got it. He's got it. He hasn't got it.

- id: t28_tv_off
  when: [tv_on == 3]
  lines:
    - cardigan: It's nice, actually, without it. You can hear yourself think.
    - team_jacket: Who wants to hear that!
  then: laugh

# ---------------------------------------------------------------- the room
# (the talk at the bar, bible/11_SKELETON.md: a real thing with a leap on the end of it, never
# settled, never explained; and the memes, which are how half the room says what it means)

- id: haarp
  when: [clock >= 1290]
  lines:
    - a: HAARP. Alaska. Look it up.
    - b: I'm not looking anything up.
    - a: A hundred and eighty antennas in a field, all pointed up.
    - b: Where else would you point them?

- id: seeding
  lines:
    - a: They seed the clouds in Alberta. That's not a theory, that's a contract.
    - b: That's for the hail. That's over Calgary.
    - a: And the rain in November '21? That just happened, did it?
    - b: That was rain. It rains here.

- id: saucers
  when: [clock >= 1320]
  lines:
    - a: The Air Force gave a bar owner fake saucer pictures. A bar owner.
    - b: Which bar?
    - a: Not this one. One down by Area 51. It was in the paper.
    - b: Gary'd have them framed behind the till.
  then: laugh

- id: the_light
  lines:
    - a: That light's out over the mainland again. Two nights now.
    - b: It's a plane.
    - a: Planes blink. It doesn't blink.
    - b: Then it's a star. Drink your drink.

- id: overdue
  lines:
    - a: They say we're overdue. The big one. Three hundred years.
    - b: They've been saying overdue since I was in school.
    - a: Well. It's more overdue now, then.

- id: two_shifts
  lines:
    - a: They're saying two shifts at the mill again by spring.
    - b: They said that in March.
    - a: Gord says the Chinese bought it. A numbered company in Richmond.
    - b: Gord says the moon landing was in Nevada.
    - a: Gord's been to Nevada.
  then: laugh

- id: ferry
  lines:
    - a: Ferry was late again. Forty minutes.
    - b: Forty's not late. Forty's the ferry.

- id: about_him
  when: [clock >= 1260]
  lines:

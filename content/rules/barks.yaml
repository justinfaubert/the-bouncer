# Barks: short lines the voices say on their own, between the written scenes.
#
# The engine offers each event below to every rule with a matching "on", keeps the rules whose
# criteria all hold, and picks among the most specific. A voice only speaks from the room, and
# how often anything speaks at all depends on tension (quiet at 0, always at 4). Most rules fire
# once a night. Full format: prototype/web/src/core/barks.js.
#
# Events:  visit:<loc>   he goes somewhere (door, floor, t28, pool, bar, hall, kitchen, keg, deck, lot)
#          drink         a drink goes in him
#          hour          the clock passes the hour
#          tension_up / tension_down
#          check_pass:<voice> / check_fail:<voice>
#          answer:<voice>   right after that voice has said one of these (see "answers" below)
#          anything named by a #bark: tag in the Ink
#
# All of these are Claude's drafts. Rewrite freely; the build checks the variable names.

# ---------------------------------------------------------------- teaching
# The first time each part of the game comes up, THE MANUAL explains it, once. The engine raises
# these events itself: teach:check (the first check on offer), teach:tension (the first time the
# noise in his head changes), teach:word (the first time a group's word on him shows), teach:room
# (the first choice that would let a voice in or put one out).

- id: teach_check
  on: teach:check
  speaker: manual
  always: true
  text: A choice with a voice's name on it is a check. That voice makes the call, and two dice have to reach the number beside it. The odds are printed. Read them.

- id: teach_tension
  on: teach:tension
  speaker: manual
  always: true
  text: When the voices are at odds it gets loud in here, and loud makes every roll swing wider, good and bad. The average does not move. See diagram.

- id: teach_word
  on: teach:word
  speaker: manual
  always: true
  text: Every group on the premises keeps its own opinion of staff, by its own rules. You will not be told what they think. You will hear what they say.

- id: teach_room
  on: teach:room
  speaker: manual
  always: true
  text: Occupancy in here is limited to five. Some choices let a voice in or put one out. The note under the choice says what it will do to the noise.

# ---------------------------------------------------------------- the door

- id: door_hour_off
  on: visit:door
  speaker: father
  when: [door_away >= 60]
  text: An hour off the door. The door doesn't care that you had reasons.

- id: door_uncounted
  on: visit:door
  speaker: wrongman
  when: [uncounted >= 2]
  text: People in you never saw. In the story it only took one.

- id: door_first_quiet
  on: visit:door
  speaker: manual
  when: [clock >= 1260, count_in <= 1]
  text: Maintain a visible presence at the point of entry. Visible means sitting up.

# ---------------------------------------------------------------- the pool table

- id: pool_left_hand
  on: visit:pool
  speaker: fighter
  when: [pool_heat >= 5, knows has pool_lefty]
  text: Left hand. Flat on the rail. It hasn't moved.

- id: pool_his_kid
  on: visit:pool
  speaker: father
  when: [knows has bigman_dad, fam_done == false]
  text: His kid's twenty feet away and he knows exactly where.

- id: pool_early
  on: visit:pool
  speaker: manual
  when: [pool_heat >= 7, fam_done == false]
  text: De-escalation is most effective before physical contact. Before is now.

# ---------------------------------------------------------------- table 28

- id: t28_leash
  on: visit:t28
  speaker: father
  when: [drinks >= 2]
  text: They'll keep them coming. That's how they pay you.

- id: t28_never_cut
  on: visit:t28
  speaker: manual
  when: [t28_rounds >= 7]
  text: Nobody has ever been refused service at this table. There is no section for that.

- id: t28_walter
  on: visit:t28
  speaker: wrongman
  when: [knows has walter_name, walter == 1]
  text: In the story it was a dog under the table. Everybody fed it. Same thing.

# ---------------------------------------------------------------- the bar

- id: bar_three
  on: visit:bar
  speaker: father
  when: [drinks >= 3]
  text: I stopped at three once. Once.

- id: bar_cold
  on: visit:bar
  speaker: fighter
  when: [rep_staff <= -2]
  text: She's not watching your back now. Nobody behind that bar is.

# ---------------------------------------------------------------- the back

- id: hall_intervals
  on: visit:hall
  speaker: manual
  text: Check washrooms at regular intervals and record the time. You have not been recording the time.

- id: hall_locked
  on: visit:hall
  speaker: wrongman
  when: [fam has kid_found, kid_out == false]
  text: A locked door with a kid behind it. That's a story nobody wants to finish.

- id: kitchen_propped
  on: visit:kitchen
  speaker: manual
  when: [kitchen_door == true]
  text: Exterior doors must not be propped open during licensed hours.

- id: kitchen_war
  on: visit:kitchen
  speaker: fighter
  when: [rats == war]
  text: You started it. Finish it where they live.

- id: deck_coaster
  on: visit:deck
  speaker: father
  when: [deck_door == true]
  text: That coaster's in the latch for somebody, and it isn't you.

- id: deck_story
  on: visit:deck
  speaker: wrongman
  text: This is where it always starts. Somebody out for a smoke, and the door left open behind them.

- id: keg_head
  on: visit:keg
  speaker: fighter
  text: Low ceiling. Don't stand up fast.

- id: keg_seen
  on: visit:keg
  speaker: wrongman
  when: [knows has knot_seen]
  text: You've seen it now. You can't go back to not having seen it.

- id: keg_stations
  on: visit:keg
  speaker: manual
  when: [poison == true]
  text: Inspect bait stations daily. Record uptake.

- id: lot_remember
  on: visit:lot
  speaker: father
  text: The ones who wait in the lot are the ones who remember you.

# ---------------------------------------------------------------- drink

- id: drink_two
  on: drink
  speaker: fighter
  when: [drinks == 2]
  text: Two's good. Two loosens the shoulders.

- id: drink_log
  on: drink
  speaker: manual
  when: [drinks >= 3]
  text: Staff shall not consume alcohol while on duty. You will be the one writing the log.

- id: drink_story
  on: drink
  speaker: wrongman
  when: [drinks >= 4]
  text: The doorman in the story was sober. It didn't help him either.

# ---------------------------------------------------------------- the clock

- id: hour_nine
  on: hour
  speaker: father
  when: [clock >= 1260, clock < 1320]
  text: Nine. Whoever comes in after nine came to stay.

- id: hour_eleven
  on: hour
  speaker: manual
  when: [clock >= 1380, clock < 1440]
  text: After eleven, walk the premises at least once an hour.

- id: hour_midnight
  on: hour
  speaker: wrongman
  when: [clock >= 1440, clock < 1500]
  text: Midnight. In the story it was always after midnight.

- id: hour_one
  on: hour
  speaker: father
  when: [clock >= 1500, clock < 1530]
  text: Half an hour to last call. Everything you let slide comes back now.

# ---------------------------------------------------------------- the room in his head

- id: tension_up_father
  on: tension_up
  speaker: father
  text: Don't let them all talk at once.

- id: tension_down_manual
  on: tension_down
  speaker: manual
  text: Quieter.

# ---------------------------------------------------------------- after a check

- id: fail_fighter
  on: check_fail:fighter
  speaker: fighter
  text: Slow. You got slow.

- id: fail_father
  on: check_fail:father
  speaker: father
  text: I'd have said less.

- id: pass_manual_father
  on: check_pass:manual
  speaker: father
  text: The book's right more often than I ever let on.

- id: fail_manual
  on: check_fail:manual
  speaker: manual
  text: This was covered on the Saturday. You were at the back.

- id: pass_wrongman_fighter
  on: check_pass:wrongman
  speaker: fighter
  text: A story's no use in a fight. Still. Fair enough.

# ---------------------------------------------------------------- answers
#
# When a voice says something above, another voice in the room may answer it: "on: answer:<voice>".
# Allies back each other up, voices at odds contradict ("ally <voice>" / "odds <voice>" in when:),
# so how they get on is something you hear. Tension decides how often anyone answers at all.
# THE TABLE and THE KID get their answers when they can be in the room, from Friday.

- id: ans_fighter_father_1
  on: answer:father
  speaker: fighter
  when: [odds father]
  text: Thirty years of doors and he still thinks it's in the eyes. It's in the feet.

- id: ans_fighter_father_2
  on: answer:father
  speaker: fighter
  when: [odds father]
  text: He'd stand there reading a man till the man hit him.

- id: ans_manual_father_1
  on: answer:father
  speaker: manual
  when: [ally father]
  text: Consistent with the course material.

- id: ans_manual_father_2
  on: answer:father
  speaker: manual
  when: [ally father]
  text: That is in the binder as well. With a diagram.

- id: ans_wrongman_father_1
  on: answer:father
  speaker: wrongman
  when: [ally father]
  text: He knew the story. Every doorman knows the story.

- id: ans_wrongman_father_2
  on: answer:father
  speaker: wrongman
  when: [ally father]
  text: Listen to him. The one in the story had nobody to listen to.

- id: ans_father_fighter_1
  on: answer:fighter
  speaker: father
  when: [odds fighter]
  text: He got paid to fight. You get paid so there isn't one.

- id: ans_father_fighter_2
  on: answer:fighter
  speaker: father
  when: [odds fighter]
  text: The first one decides it. Then the police decide the rest.

- id: ans_manual_fighter_1
  on: answer:fighter
  speaker: manual
  when: [odds fighter]
  text: Force must be reasonable, necessary and proportionate. He has not read those words.

- id: ans_manual_fighter_2
  on: answer:fighter
  speaker: manual
  when: [odds fighter]
  text: Physical intervention is last on the list. It is last for a reason.

- id: ans_wrongman_fighter_1
  on: answer:fighter
  speaker: wrongman
  when: [odds fighter]
  text: The doorman in the story was ready for a fight. That isn't what came in.

- id: ans_wrongman_fighter_2
  on: answer:fighter
  speaker: wrongman
  when: [odds fighter]
  text: The wrong man is never the one squaring up to you.

- id: ans_father_manual_1
  on: answer:manual
  speaker: father
  when: [ally manual]
  text: Book's right. It just won't be standing next to you.

- id: ans_father_manual_2
  on: answer:manual
  speaker: father
  when: [ally manual]
  text: Listen to it. I didn't, and I learned all of it the long way.

- id: ans_fighter_manual_1
  on: answer:manual
  speaker: fighter
  when: [odds manual]
  text: Nobody in that conference room ever got hit.

- id: ans_fighter_manual_2
  on: answer:manual
  speaker: fighter
  when: [odds manual]
  text: Read him that when he's got you by the collar.

- id: ans_wrongman_manual_1
  on: answer:manual
  speaker: wrongman
  when: [odds manual]
  text: The doorman in the story had his licence. It was in his wallet the whole time.

- id: ans_wrongman_manual_2
  on: answer:manual
  speaker: wrongman
  when: [odds manual]
  text: There's no page in there for what came through that door.

- id: ans_father_wrongman_1
  on: answer:wrongman
  speaker: father
  when: [ally wrongman]
  text: Drunks tell it better than it happened. Doesn't mean it didn't.

- id: ans_father_wrongman_2
  on: answer:wrongman
  speaker: father
  when: [ally wrongman]
  text: Every door I worked had a story like that. Every one of them was true somewhere.

- id: ans_fighter_wrongman_1
  on: answer:wrongman
  speaker: fighter
  when: [odds wrongman]
  text: Stories. Watch the room.

- id: ans_fighter_wrongman_2
  on: answer:wrongman
  speaker: fighter
  when: [odds wrongman]
  text: Forget the brother. Watch the hands in front of you.

- id: ans_manual_wrongman_1
  on: answer:wrongman
  speaker: manual
  when: [odds wrongman]
  text: An anecdote is not evidence. Record what you observe.

- id: ans_manual_wrongman_2
  on: answer:wrongman
  speaker: manual
  when: [odds wrongman]
  text: The incident log has no field for a feeling.

# ---------------------------------------------------------------- voices he may take home (Friday on)

- id: table_drink
  on: drink
  speaker: table
  when: [drinks >= 1]
  text: There he is!

- id: kid_door
  on: visit:door
  speaker: kid
  text: they all look at the door before they look at you

# ---------------------------------------------------------------- the hand
#
# The voices and the player. While the player has a hand on a choice (the pointer resting on it, a
# press and hold on a phone, a key on it), a voice can lean in on it before it's made. The engine
# tries what the choice is, most particular first:
#   hand:<what it tempts him with>     #hand: in the Ink. drink; shade (writing the log so it reads
#                                      better); omit (leaving something out of the log)
#   hand:check:<voice>                 the voice lending the check
#   hand:room_in:<voice> / hand:room_out:<voice>    letting a voice in, putting one out
#   hand:leave_door                    walking away from the door
#   hand:loc:<place>                   where it goes
# And they notice the player:
#   hand:wait        the choices have been sitting there a long while
#   hand:reread      scrolled back up the night, reading it again
#   hand:back        back after a while away from the game
#   hand:rush        choosing without reading
#   hand:resisted:<what>   had a hand on something he's tempted by, and chose something else
# Each is said once a night, whatever the noise in his head, and only by a voice in the room. What
# the voices say to the player isn't written into the night, except hand:resisted, which goes in
# under the choice.

- id: hand_drink_first
  on: hand:drink
  speaker: father
  when: [drinks == 0]
  text: Nobody has to take the first one.

- id: hand_drink_hand
  on: hand:drink
  speaker: father
  when: [drinks >= 2]
  text: I know that hand. I had that hand.

- id: hand_drink_count
  on: hand:drink
  speaker: father
  when: [drinks == 1]
  text: You're counting the door. Count these.

- id: hand_drink_fighter
  on: hand:drink
  speaker: fighter
  when: [drinks <= 1]
  text: Take it. They're watching to see if you will.

- id: hand_drink_manual
  on: hand:drink
  speaker: manual
  text: Staff may accept a drink from a patron and hold it without drinking it. See Refusals.

- id: hand_drink_wrongman
  on: hand:drink
  speaker: wrongman
  text: The doorman in the story had one with them too. To be friendly.

- id: hand_drink_table
  on: hand:drink
  speaker: table

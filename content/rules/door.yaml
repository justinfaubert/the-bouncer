# The door, busier: who comes to it on a night, and what they say (bible/11_SKELETON.md, "The door,
# busier: the town"). The people are the town's, made once a game (content/data/people.yaml,
# prototype/web/src/core/folk.js); this is when they come, what the door calls them, and their words.
#
# Everything here is Claude's draft (PROPOSED). HUTCH: rewrite any line, and add the ones only a
# doorman would know. The rules for who talks how are bible/10_VOICES.md: cover the name, and you
# should still be able to tell a mill hand from a nurse from a kid with his brother's licence.

# ---------------------------------------------------------------- nights
#
# day: the day of the month. come: out of a hundred, how many of each kind of regular (people.yaml,
# drink.regular) come to the door that night. trickle: when the ones who don't come with a wave
# come, as [the start of a forty-minute stretch, how many in ten]. tries: how many of the town's
# teenagers try the door that night, at the least and the most; tries_at: when. waves: the reasons a
# Friday comes in a body (bible/11_SKELETON.md, The waves): when each wave reaches the door.
#
# The clock is minutes from the midnight before: 1170 is 7:30 pm, 1440 midnight, 1530 last call.

nights:
  - day: 1          # Wednesday, the test shift: the regulars, and nearly nobody else
    come: {nightly: 45, weekly: 10, weekends: 2, rarely: 2, never: 0}
    trickle: [[1180, 3], [1220, 3], [1260, 2], [1300, 2], [1340, 2], [1380, 1], [1420, 1], [1460, 1]]
    tries: [0, 1]
    tries_at: [1290, 1450]
  - day: 3          # Friday: everybody
    come: {nightly: 90, weekly: 65, weekends: 85, rarely: 25, never: 3}
    trickle: [[1170, 2], [1210, 4], [1250, 4], [1290, 3], [1330, 4], [1370, 4], [1410, 3], [1450, 2], [1490, 1]]
    tries: [2, 4]
    tries_at: [1290, 1480]
    waves:
      dinner: {at: [1170, 1205]}    # the prime rib: the old couples, before the room gets loud
      arena: {at: [1305, 1325]}     # the beer league's late game lets out at the arena
      swing: {at: [1412, 1432]}     # the mill's swing shift lets out at half eleven, and the hospital's evening shift
      legion: {at: [1445, 1462]}    # the Legion shuts at midnight and sends its drinkers up the highway
      ferry: {at: [1470, 1488]}     # the last boat's in and tied up

# ---------------------------------------------------------------- what the door calls them
#
# A doorman tags people by what he sees until he knows their names (content/data/characters.yaml).
# The first of these that fits and isn't taken tonight: a hat, the top (by its shape and colour,
# "top:material", or by its shape), the face, the hair, then the rest of the top's. Nobody is tagged
# by a turban. The cast's own tags (cast) are never used: tools/build.mjs fills them in from
# characters.yaml.

tags:
  hat:
    cap: [TRUCKER CAP, CAP]
    beanie: [TOQUE, WOOL HAT]
    flatcap: [FLAT CAP]
  top:
    workjacket: [CANVAS COAT, WORK COAT]
    workjacket:jacket: [WORK JACKET, CANVAS JACKET]
    workjacket:coat: [WAXED COAT, WORK COAT]
    flannel: [FLANNEL, PLAID]
    flannel:flannel_b: [BLUE PLAID, PLAID]
    hivis: [SAFETY VEST, YELLOW VEST]
    hoodie: [ZIP-UP, DARK HOOD]
    hoodie:sweatshirt: [GREY HOOD, SWEATS]
    hoodie:cardigan_b: [BLUE HOOD, ZIP-UP]
    fleece: [FLEECE, QUARTER-ZIP]
    fleece:sweater: [GREEN FLEECE, FLEECE]
    sweater: [CABLE KNIT, WOOL SWEATER]
    sweater:cardigan: [BROWN SWEATER, CREWNECK]
    sweater:cardigan_c: [ROSE SWEATER, CREWNECK]
    cardigan: [BROWN KNIT, BUTTONS]
    cardigan:cardigan_b: [BLUE KNIT, BUTTONS]
    cardigan:cardigan_c: [ROSE KNIT, BUTTONS]
    jacket: [BOMBER, NAVY JACKET]
    jacket:denim: [JEAN JACKET, DENIM]
    jacket:coat: [SHORT COAT, BOMBER]
    raincoat: [RAIN SHELL, SLICKER]
    raincoat:coat: [LONG COAT, SLICKER]
    tshirt: [T-SHIRT, SHORT SLEEVES]
    tshirt:sweatshirt: [SWEATSHIRT, CREWNECK]
    coat: [PARKA, BIG COAT]
    coat:raincoat: [DUFFEL, TOGGLES]
    coat:suit: [OVERCOAT, DARK COAT]
    scrubs: [SCRUBS, SCRUB TOP]
    scrubs:scrubs_b: [NAVY SCRUBS, SCRUBS]
  face:
    beard: [BEARD, BIG BEARD]
    moustache: [MOUSTACHE]
    glasses: [SPECS, FRAMES]
  hair:
    ponytail: [PONYTAIL]
    bun: [TOP KNOT]
    long: [LONG HAIR]
    buzz: [BUZZ CUT]
    bald: [BALD]
    messy: [BEDHEAD]
    thin: [COMB-OVER]

# What they're wearing, the way the teller says it: by "top:material", or the top.
wear:
  workjacket: in a canvas work coat
  workjacket:jacket: in a work jacket
  workjacket:coat: in a waxed work coat
  flannel: in a flannel shirt
  flannel:flannel_b: in a blue plaid shirt
  hivis: in a safety vest over {his} coat
  hoodie: in a hoodie
  hoodie:sweatshirt: in a grey hoodie
  hoodie:cardigan_b: in a blue hoodie
  fleece: in a fleece
  fleece:sweater: in a green fleece
  sweater: in a wool sweater
  sweater:cardigan: in a brown sweater
  sweater:cardigan_c: in an old rose sweater
  cardigan: in a cardigan
  cardigan:cardigan_b: in a blue cardigan
  cardigan:cardigan_c: in a rose cardigan
  jacket: in a bomber jacket
  jacket:denim: in a jean jacket
  jacket:coat: in a short coat
  raincoat: in a rain shell
  raincoat:coat: in a long raincoat
  tshirt: in a T-shirt, in November
  tshirt:sweatshirt: in a sweatshirt
  coat: in a parka
  coat:raincoat: in a duffel coat
  coat:suit: in a dark overcoat
  scrubs: in scrubs under {his} coat
  scrubs:scrubs_b: in navy scrubs under {his} coat

# A hat, after the top: "a man in a parka and a toque pulled down over his ears".
hats:
  cap: and a ball cap pulled down
  beanie: and a toque pulled down over {his} ears
  flatcap: and a flat cap

# ---------------------------------------------------------------- what they say
#
# Each line is for one moment (on), said by whoever's at the front of the line unless it says
# otherwise. The Ink asks for a moment (door_say in content/ink/line.ink) and gets the most particular
# line that fits and hasn't been said this game (rank: points on top, to make a line win); once
# they've all been said, the one said longest ago. A line marked free can be said again (the answers
# to his questions, which are only the card read back). What a line can ask of who it's for:
#
#   reg       who they talk like: teen (under nineteen), kid (nineteen to twenty-five), work (the
#             mill, the trades, the farms), hospital, harbour (the ferry, the boats), strip (the
#             Esso, the diner, the shops, out of work), town (everybody else), old (retired)
#   sex       m | f              ages      [lowest, highest]      teen      true | false
#   drunk     at least this drunk: 1 a few in, 2 drunk, 3 hammered     sober     true | false
#   wave      dinner | arena | swing | legion | ferry | trickle
#   work, group, detail, retired, regular, cast     one of, from people.yaml
#   known     he's dealt with them before     was: what he did then (in | refused | kept)
#   rapport   he talked with them, last time
#   fake      a teenager trying it        kind: the card they hand him (own | sib | lifted | printed | phone)
#   partner   they're married, or living with someone
#   noid      no card on them    expired, oop (from out of province), idcard (the province's ID, not a licence)
#   hes       they had to think about the answer    wrong: the answer isn't what the card says
#   slip      the real year came out first
#   took      he's holding the card        asked: he's asked them something    caught: something on it stopped him
#   scan      what the scanner said: ok | red | real | seen | expired | oop
#   looked    the card held up by the face: match | eyes | height | older | young
#   n         how many in the line behind them, [lowest, highest]     together: some of them came with them
#   behind    they came with the one he's just dealt with
#   waited    minutes they stood in the line, [lowest, highest]
#   why       back (from the truck with the card) | card (come for the licence he kept)
#
# In the text, braces are filled in: {he} {him} {his} {He} {His}; {a_person} {A_person} {the_person}
# {The_person} (a man, a woman, a kid, a girl, an old man...); {in_top} {with_hat}; {others} (who's
# with them, still in the line); {prev} (the one before them, that they came with); {detail_see} {Detail_see} {detail_read} {Detail_read} (people.yaml, details); {does};
# {tie} (people.yaml, cast_ties); {age} {Age}; {n} {N} (the line, in words); {waited}; {met_when}; and from the
# card in his hand: {card_name} {card_given} {card_middle} {card_age} {card_year} {card_month}
# {card_day} {card_sign} {card_postal} {card_eyes} {card_height} {card_expired}, and {eyes}, the eyes
# in front of him. What they've just said: {said}, {middle}, {month} {day_ord}, {sign}, {year_long}
# {year_short}, {postal_said}, {slip}. Whose card it really is: {owner_given} {owner_name}
# {owner_when} {owner_sib} (brother or sister); and to the one come for it, {teen_sib}.
# {x|lc} is x in lower case, for the kids, who type like they talk.

lines:

  # ---- coming up to the stool (the teller)

  - {on: arrive, text: "{A_person} {in_top}{with_hat} came up out of the lot and stood in front of the stool."}
  - {on: arrive, text: "{A_person} {in_top}{with_hat} shook the rain off at the top of the steps."}
  - {on: arrive, text: "Next was {a_person} {in_top}{with_hat}."}
  - {on: arrive, text: "{A_person} {in_top}{with_hat} stepped up and wiped {his} feet on the mat like it was somebody's house."}
  - {on: arrive, text: "{A_person} {in_top}{with_hat} came in out of the rain with {his} collar up."}
  - {on: arrive, text: "Then {a_person} {in_top}{with_hat}, keys still in {his} hand from the truck."}
  - {on: arrive, text: "{A_person} {in_top}{with_hat} came up the steps with {his} phone still lit in {his} hand, finishing a text."}
  - {on: arrive, text: "{A_person} {in_top}{with_hat} came out of a cab that didn't wait."}
  - {on: arrive, text: "{A_person} {in_top}{with_hat} came up the steps, read the room through the glass behind him, and decided it would do."}
  - {on: arrive, text: "{A_person} {in_top}{with_hat} came across the gravel at a jog with {his} collar held shut."}
  - {on: arrive, text: "{A_person} {in_top}{with_hat} stopped under the light over the door and counted {his} cash before {he} came the last step."}
  - {on: arrive, n: [4, 99], text: "{A_person} {in_top}{with_hat} came up to the stool, with {n} more behind {him} in the rain."}
  - {on: arrive, n: [6, 99], text: "The line moved up one. {A_person} {in_top}{with_hat}, wet, and not pleased about it."}
  - {on: arrive, reg: old, text: "{A_person} {in_top}{with_hat} took the steps one at a time with a hand on the rail, not from drink."}
  - {on: arrive, reg: work, text: "{A_person} {in_top}{with_hat} came up the steps with the day's work still in {his} walk."}
  - {on: arrive, reg: hospital, text: "{A_person} {in_top}{with_hat} came up the steps like {his} feet were somebody else's."}
  - {on: arrive, reg: kid, text: "{A_person} {in_top}{with_hat} came up the steps talking over {his} shoulder to somebody in a car."}
  - {on: arrive, behind: true, rank: 4, text: "Then {the_person} {in_top}{with_hat}, who'd come up the steps with {prev}."}
  - {on: arrive, behind: true, rank: 4, text: "{The_person} {in_top}{with_hat} who was with {prev} stepped up next."}
  - {on: arrive, behind: true, rank: 4, text: "Next, {the_person} {in_top}{with_hat}, the other half of {prev}'s party."}
  - {on: arrive, together: true, text: "{A_person} {in_top}{with_hat}, and with {him}, {others}."}
  - {on: arrive, together: true, text: "They came up the steps together: {a_person} {in_top}{with_hat}, and {others}."}
  - {on: arrive, together: true, text: "{A_person} {in_top}{with_hat} came up first, with {others} behind."}
  - {on: arrive, together: true, n: [3, 99], text: "{A_person} {in_top}{with_hat} came up at the head of a little knot of them: {others}."}
  - {on: arrive, drunk: 2, text: "{A_person} {in_top}{with_hat} came up the steps one at a time, a hand on the rail."}
  - {on: arrive, drunk: 2, text: "{A_person} {in_top}{with_hat}, a few in already, and carrying them carefully."}
  - {on: arrive, drunk: 3, text: "{A_person} {in_top}{with_hat} missed the top step, found it, and looked at it like it had moved."}
  - {on: arrive, waited: [15, 999], text: "{A_person} {in_top}{with_hat} got to the front of the line {waited} after {he} got in it, and was wet through for it."}
  - {on: arrive, waited: [20, 999], text: "{A_person} {in_top}{with_hat} had been in the rain {waited}, and let him know it with {his} face."}
  - {on: arrive, wave: dinner, text: "{A_person} {in_top}{with_hat} came in for the prime rib, by the look of {him}: hair combed for it."}
  - {on: arrive, wave: dinner, text: "{A_person} {in_top}{with_hat}, here for dinner, in {his} going-out shoes."}
  - {on: arrive, wave: dinner, together: true, text: "{A_person} {in_top}{with_hat}, and {others}, arm in arm under one umbrella, here for the prime rib."}
  - {on: arrive, wave: arena, text: "{A_person} {in_top}{with_hat} came up from the lot with a hockey bag still over {his} shoulder."}
  - {on: arrive, wave: arena, text: "{A_person} {in_top}{with_hat}, hair still wet from the rink's showers."}
  - {on: arrive, wave: arena, together: true, text: "The beer league came up the steps loud: {a_person} {in_top}{with_hat}, {others}."}
  - {on: arrive, wave: swing, group: mill, text: "{A_person} {in_top}{with_hat}, straight off the swing shift, still walking like the floor was moving."}
  - {on: arrive, wave: swing, group: mill, text: "{A_person} {in_top}{with_hat} came up with the mill still on {him}, the noise of it in {his} shoulders."}
  - {on: arrive, wave: swing, group: mill, together: true, text: "Half the swing shift's green chain came up the steps in a body: {a_person} {in_top}{with_hat}, {others}."}
  - {on: arrive, wave: swing, group: hospital, text: "{A_person} {in_top}{with_hat}, the hospital's evening shift, done, with the hill's cold still on {him}."}
  - {on: arrive, wave: swing, group: hospital, together: true, text: "The evening shift came down the hill together: {a_person} {in_top}{with_hat}, {others}."}
  - {on: arrive, wave: legion, text: "{A_person} {in_top}{with_hat} came up the highway from the Legion with the Legion's last call still in {him}."}
  - {on: arrive, wave: legion, text: "{A_person} {in_top}{with_hat}, sent up the highway by the Legion closing, a poppy on {his} coat."}
  - {on: arrive, wave: ferry, text: "{A_person} {in_top}{with_hat} came up from the ferry with the salt still on {him}."}
  - {on: arrive, wave: ferry, text: "{A_person} {in_top}{with_hat}, off the last boat, with the look of somebody who'd been on the mainland all day."}
  - {on: arrive, teen: true, text: "{A_person} {in_top}{with_hat} came up with {his} hands in {his} pockets, too casual by half."}
  - {on: arrive, teen: true, text: "{A_person} {in_top}{with_hat} stopped a step short of the stool, like the stool might ask {him} something."}
  - {on: arrive, teen: true, together: true, text: "{A_person} {in_top}{with_hat} came up close behind {others}, close enough to be part of them."}
  - {on: arrive, known: true, text: "{A_person} {in_top}{with_hat} came up the steps. He'd seen {him} {met_when}."}
  - {on: arrive, known: true, was: refused, text: "{A_person} {in_top}{with_hat} came up the steps: the one he'd turned away {met_when}. {He} remembered him too."}
  - {on: arrive, why: back, text: "{The_person} {in_top} was back from the truck, wetter, with the card in {his} hand."}
  - {on: arrive, why: back, text: "{The_person} {in_top} came back up the steps with {his} wallet out and open."}
  - {on: arrive, why: card, text: "{A_person} {in_top}{with_hat} came up the steps fast and didn't stop to shake the rain off."}


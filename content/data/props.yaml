# ---------------------------------------------------------------- his own
#
# type: security draws a security worker's licence instead of a driver's (no real province's):
# the title, a seal, the photo, an expiry, a number, and the name, which is under Gary's thumb in
# the office and drawn as worn bars in the hand (his name is Hutch's).

his_licence:
  kind: card
  type: security
  face: him
  look: {hair: buzz, top: tshirt}                        # cropped short, the way they do it in the army, or after something
  role: SECURITY WORKER
  issued: "2024-10-21"
  expires: "2027-10-21"                                  # "Good till next October" (office.ink)
  number: "SW 118340"

# Not handed to him at all: his legs, in the 3D build (godot/game/going.gd). A body can walk
# (across the room: the hub's #unlisted choice, content/ink/floor.ink) and ran (across the bar's
# floor, in front of everyone: toy_legs, content/ink/toys.ink). Nothing draws it.

legs:
  kind: body

# ---------------------------------------------------------------- the kid's phone
#
# photos, in order: card (a licence, photographed on something), or place (a plate of a place,
# photographed through something). battery: percent.

hoodie_phone:
  kind: phone
  whose: hoodie
  battery: 6                                             # he's been awake two days
  photos:
    - {card: hoodie_card, on: kitchen table}
    - {place: pool, through: the front window, from: the lot}

# ---------------------------------------------------------------- the binder under the till
#
# "A two-inch binder, the plastic sleeves gone cloudy. Photocopied licences, phone photos printed on
# the office printer, a few real photographs. Under each one, in marker, in her handwriting: a date,
# sometimes a reason, always a length." (content/ink/bar.ink)
#
# She keeps the ones that matter at the front. Behind them it goes back years, and the six-month
# ones that ran out are still in there, because nobody takes anybody out.
#
# sleeves: the pages written out. photo: photocopy (of a licence), printout (a phone photo off the
#   office printer) or photograph. who: a look, as in characters.yaml, for a face nobody in the
#   story has; face: someone who is in the story; card: a licence above, photocopied.
#   date, length, reason, or words: what she wrote under it.
# The pages that aren't written out are made up the same way every time, from the page number.
#
# HUTCH: the reasons are yours (the prompt at the binder in content/ink/bar.ink). Until then the
# pages carry a date and a length, and page three carries what the Ink says it does.

binder:
  kind: binder
  pages: 40
  sleeves:
    1:  {photo: printout, who: {age: young, hair: buzz, top: hoodie, face: [stubble], mood: hard}, date: "2026-10-17", length: SIX MONTHS}
    2:  {photo: photocopy, who: {build: big, hair: short, top: flannel, face: [beard], mood: flat}, date: "2026-08-29", length: ONE YEAR}
    3:  {photo: photocopy, card: goodshoes_card, words: NO. NOT EVER.}
    4:  {photo: printout, who: {sex: f, hair: long, top: jacket, mood: drunk}, date: "2026-07-03", length: SIX MONTHS}
    5:  {photo: photograph, who: {age: old, hat: cap, top: coat, face: [lined], mood: tired}, date: "2025-12-24", length: ONE YEAR}
    6:  {photo: photocopy, who: {hair: messy, top: tshirt, mood: wary}, date: "2026-05-16", length: ONE YEAR}
    7:  {photo: photograph, who: {sex: f, hair: short, top: jacket, mood: hard}, date: "2024-03-09", length: LIFE}
    8:  {photo: printout, face: ballcap, date: "2026-10-02", length: THREE MONTHS}    # till his birthday (drawer.ink)
    9:  {photo: photocopy, who: {build: big, hair: bald, top: hivis, face: [stubble], mood: flat}, date: "2025-06-21", length: TWO YEARS}
    10: {photo: printout, who: {hair: thin, top: jacket, face: [glasses], mood: drunk}, date: "2026-02-14", length: ONE YEAR}
    11: {photo: printout, who: {hair: buzz, top: tshirt, face: [necktat], mood: hard}, date: "2023-11-11", length: LIFE}

# ---------------------------------------------------------------- what he carries, and what he picks up
#
# His pockets are the inventory (content/ink/hand.ink, bible/11_SKELETON.md: What he carries). Each
# thing here is one he holds in a scene, and the voices read it; most can go in a pocket, the lost-
# and-found drawer behind the bar, or room twelve.
#
# shape: what it's made as, in his hand in the Godot build (godot/game/props.gd) and on the page in
#   the browser's (prototype/web/src/ui/props.js): flashlight, key, shirt, bill, straw, keys, glass,
#   bag, mat, tickets, book, jacket, remote, phone (a lock screen, the front lines on it), wallet.
# cloth: a jacket's colour, if it isn't the last doorman's brown canvas.
# front, back: what's on each side, a line at a time. A line starting ~ is somebody's hand, in pencil
#   or marker, not print.
# The four things about every item, for his notes (the skeleton): whose it is and how he came by it;
#   heat, the trouble it is if it's found on him; what it does; and what it's worth, and to whom.
# All of it Claude's drafts (PROPOSED in bible/05_LOG.md).

flashlight:
  kind: thing
  shape: flashlight
  name: His flashlight
  front: ["Two D cells, steel"]
  whose: His own. It's been in his right pocket at every door he's worked.
  heat: None, till he swings it. Then it's a weapon, in law.
  does: Lights the keg room, and the eyes in it, and the hologram on a licence.
  worth: Thirty dollars, new.

room_key:
  kind: thing
  shape: key
  name: The key to twelve
  front: ["12"]
  whose: The Sov's. Gary took it off the hook behind him and put it on the desk.
  heat: None.
  does: Room twelve, at the end of the hall over the deck. Terry has the other one. Terry has every key.
  worth: Six-fifty a month, with the hydro, off the top of his pay.

gary_shirt:
  kind: thing
  shape: shirt
  name: Gary's shirt
  front: [""]
  back: [SECURITY]
  whose: Gary's, out of the box of forty-eight in the corner of his office.
  heat: Everybody can see what he is.
  does: Says SECURITY across his back, a hand high, in white.
  worth: Eleven dollars to Gary. Twenty-four off Friday's cheque, if he read the form.

fifty:
  kind: thing
  shape: bill
  # the press's inks, not the note's own colour: red is the sign's, and blood's
  name: A fifty, folded small
  front: ["50"]
  back: ["50"]
  whose: Table 28's. The one in the team jacket put it in his pocket.
  heat: Whose man he is.
  does: Buys a night. Buys him, if he keeps it.
  worth: Fifty dollars.

straw:
  kind: thing
  shape: straw
  name: A straw, cut down to two inches
  whose: Somebody on staff's. It was on the mirror on the desk in the office downstairs.
  heat: Possession, and whose it is.
  does: Nothing, now. It says what somebody did.
  worth: Nothing. A lot, to whoever it belongs to.

truck_keys:
  kind: thing
  shape: keys
  name: The big man's keys
  front: ["~ a Ford key, a house key, a rabbit's foot gone grey"]
  whose: The big man's, from the pool table. He put them in his hand in the lot.
  heat: Somebody else's keys. He'll come looking for them.
  does: His work truck, his house.
  worth: His truck and his work, to him. Maybe his life, tonight.

pint:
  kind: thing
  shape: glass
  name: A pint of the red
  whose: The Sov's. He pulled it himself, behind her bar.
  heat: Not rung in.
  does: A drink, and nobody owes anybody.
  worth: Seven-fifty.

float_bag:
  kind: thing
  shape: bag
  name: The last doorman's float
  front: ["$208"]
  back: ["~ FLOAT    400.00", "~ SEP 18  - 96.00", "~ SEP 25  - 96.00", "~          208.00"]
  whose: The Sov's door float, out of the right pocket of the last doorman's jacket.
  heat: Cash that isn't his. The bookkeeper counts.
  does: Says somebody paid him short, two Fridays running, and he took what he was owed.
  worth: Two hundred and eight dollars.

beer_mat:
  kind: thing
  shape: mat
  name: The last doorman's beer mat
  front: [THE SOVEREIGN, HOTEL, BEER PARLOUR]
  back: ["~ JUL 27   4", "~ AUG 10   9", "~ AUG 24  17", "~ SEP 14  35", "~ (the knot, drawn)", "~ BEHIND 28"]
  whose: The last doorman's. He counted them on it.
  heat: None. Nobody would believe it.
  does: Where they are, drawn, behind table 28. They double.
  worth: To the old man at the end of the bar, something.

ferry_tickets:
  kind: thing
  shape: tickets
  name: Two ferry tickets
  front: [FOOT PASSENGER, ADULT  ONE WAY, FRI 02 OCT 2026, "SAILING 23:15"]
  whose: The last doorman's, and somebody's he never said.
  heat: None. Only somebody's heart.
  does: The last boat, the Friday he went. Neither one torn.
  worth: Nothing now. They were good for the one sailing.

minor_card:
  kind: card
  face: ballcap
  look: {hat: none, hair: short}                         # cap off for the photo, the way they make you
  surname: MACAULAY
  given: RYAN THOMAS
  born: "2008-01-02"                                     # eighteen tonight; nineteen on 2 January
  issued: "2025-03-14"
  expires: "2030-01-02"
  class: 7N
  sex: M
  height: 185
  weight: 72
  eyes: BLU
  hair: BRN
  number: "7718405"
  name: A boy's licence
  whose: A boy's, eighteen. The last doorman held it at the door and let him in on it.
  heat: A minor's licence, on the doorman. The Manual has a word for that.
  does: Gets the boy in, the day it comes back to him and he's nineteen.
  worth: Everything, to a boy of eighteen.

aikido_book:
  kind: thing
  shape: book
  name: A paperback on aikido
  front: [AIKIDO]
  back: ["COMMUNITY HALL", "AIKIDO  TUESDAYS 7 PM", "$15  BEGINNERS WELCOME"]
  whose: Nobody's. It's been in the lost-and-found since the summer.
  heat: None.
  does: Wrist locks, and the idea that the other man's force is a gift. The class is Tuesdays at the community hall.
  worth: A dollar at a yard sale. Maybe more, later.

last_jacket:
  kind: thing
  shape: jacket
  name: The last doorman's jacket
  whose: The last doorman's. Folded at the bottom of the lost-and-found since the Friday he went.
  heat: None, unless he comes back for it.
  does: Three pockets, with table 28's four stories in them.
  worth: Thirty-three days of nobody wanting to know.

# ---------------------------------------------------------------- the room's things (content/ink/room.ink)

remote:
  kind: thing
  shape: remote
  name: The TV remote
  back: ["~ TV"]
  whose: The Sov's. She keeps it under the bar rag by the till, the black one, not the jukebox's.
  heat: Table 28's hockey.
  does: Says what the room looks at, at eleven. The news sets table 28 off.
  worth: Nothing. Everything, to table 28, at half past eleven.

bm_cell:
  kind: thing
  shape: phone
  name: The big man's phone
  # the lock screen, newest on top: his daughter's messages, in her full sentences
  front: [KAYLA, "11 missed calls", "We're outside in the truck. Tyler's going in to get you.", "She wants you there. We're coming to get you.", "They think it's her heart.", "Dad, call me. It's Mom. We're at the hospital."]
  whose: The big man's, out of the inside pocket of his jacket on the hook by the dartboard.
  heat: His hand in another man's coat.
  does: Rings. His daughter, all night.
  worth: Everything she has to tell him.

gs_wallet:
  kind: thing
  shape: wallet
  name: GOOD SHOES's wallet
  whose: GOOD SHOES's. It came out of his coat by the stool when he was put out.
  heat: A barred man's money, on the doorman.
  does: Brings him back for it.
  worth: Four hundred and sixty dollars, a gold card, and a photograph.

bm_coat:
  kind: thing
  shape: jacket
  cloth: "5c4630"             # the mill's canvas, darker than the last doorman's
  name: The big man's jacket
  whose: The big man's, off its hook by the dartboard. He went out without it.
  heat: None, unless somebody's been in the pockets.
  does: Keeps his phone, and the rain off him, when he's wearing it.
  worth: To his daughter at two in the morning, the phone in it.

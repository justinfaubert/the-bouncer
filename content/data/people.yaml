  town_works:  {name: for the town, does: on the town's works crew, place: null, ages: [22, 64], m: 8, f: 2, share: 2,
                shifts: [day], tops: [hivis, workjacket], details: [hivis_town, mud_cuffs], group: trades}
  office_work: {name: in an office, does: at the credit union, place: cafe, ages: [22, 66], m: 4, f: 6, share: 3,

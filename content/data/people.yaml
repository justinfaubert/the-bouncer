# The town's people: what the generator makes them from, once a game, from the game's seed
# (prototype/web/src/core/town.js, and its twin godot/engine/town.gd, which has to make the same
# town from the same seed: tools/town_diff.mjs checks it). Their streets are content/data/town.yaml;
# what they say and do at the door is content/rules/door.yaml.
#
# bible/11_SKELETON.md, "The people are generated on them": names, ages, faces from parts, families
# (brothers, sisters, exes, kids), work, an address on a real street, how they drink, a debt, a
# grudge, one secret. Everyone the door sees is one of them. This is the first hundred of the four
# hundred: the adults nearest the Sov, and the teenagers who live with them.
#
# Everything here is Claude's draft. HUTCH: change anything, and say where it's wrong for the
# island. Nobody from a First Nation is made here: whether a Nation is in the game, and how, is
# Hutch's call (05_LOG.md, open question 23).

adults: 100

# ---------------------------------------------------------------- who they come from
#
# A household's background gives its surnames and, where it isn't the settler lists, its given
# names. share: how many households in a hundred. Mixed couples happen (mixed: how often the
# second adult comes from anywhere). looks: where it isn't the settler odds, hair and eyes (dark:
# the hair_colour and eyes tables under looks, below).

backgrounds:
  settler:
    share: 76
    surnames: [Kowalski, Harris, McLeod, Fraser, Campbell, MacDonald, Robertson, Thompson, Anderson, Olsen, Hansen,
      Lindgren, Nielsen, Pedersen, Van der Meer, De Vries, Bakker, Schultz, Becker, Wagner, Hoffman, Bondarenko,

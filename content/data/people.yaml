# ---------------------------------------------------------------- households
#
# Who lives together. adults: how many nineteen and over, ages: the oldest's range, gap: how far the
# others' ages are from the oldest's, teens: how many fifteen to eighteen, kids_gap: how much older
# than the eldest teen a parent is, homes: what they live in (town.yaml streets' homes), share: how
# many in a hundred households.

households:
  - {id: single,       share: 22, adults: 1, ages: [22, 74], homes: [suite, flat, unit, house, trailer]}
  - {id: couple,       share: 18, adults: 2, ages: [24, 82], gap: 6, homes: [house, unit, trailer, flat]}
  - {id: family,       share: 16, adults: 2, ages: [36, 58], gap: 4, teens: [1, 2], kids_gap: [22, 36], homes: [house, house, trailer, suite]}
  - {id: family_grown, share: 9,  adults: 3, ages: [44, 70], gap: 4, grown: [19, 30], teens: [0, 1], homes: [house]}
  - {id: single_parent, share: 7, adults: 1, ages: [33, 54], teens: [1, 2], kids_gap: [20, 34], homes: [suite, trailer, unit, house]}
  - {id: roommates,    share: 9,  adults: [2, 3], ages: [19, 31], gap: 5, homes: [suite, unit, house, flat]}
  - {id: widowed,      share: 9,  adults: 1, ages: [66, 90], homes: [house, unit, trailer]}
  - {id: by_the_week,  share: 6,  adults: 1, ages: [24, 66], homes: [motel, room]}
  - {id: alone_old,    share: 4,  adults: 1, ages: [58, 80], homes: [trailer, house, room]}

# Two in a couple are a man and a woman most of the time; same: how often they're two men or two
# women, in a hundred couples. kept_name: how often the second keeps their own surname.
couples: {same: 6, kept_name: 30}

# ---------------------------------------------------------------- work
#
# place: town.yaml places. ages: who does it. m, f: the odds it's a man or a woman, out of ten.
# share: how common, against the rest, among those of an age to do it. shifts: when they work (day,
# swing: three to eleven, graveyard: eleven to seven). tops: what they'd come to the door in.
# details: what he can read off them (below), group: who they drink with, by the bar's codes.

works:
  mill:        {name: at the mill, does: on the green chain at the mill, place: mill, ages: [19, 64], m: 9, f: 1, share: 13,
                shifts: [day, swing, graveyard], tops: [workjacket, flannel, hivis, hoodie], details: [sawdust, earplugs, gate_pass, cedar], group: mill}
  sawfiler:    {name: at the mill, does: filing saws at the mill, place: mill, ages: [30, 64], m: 10, f: 0, share: 2,
                shifts: [day], tops: [flannel, workjacket], details: [filings, earplugs, gate_pass], group: mill}
  mill_office: {name: at the mill, does: in the mill office, place: mill, ages: [24, 64], m: 3, f: 7, share: 3,
                shifts: [day], tops: [sweater, fleece, cardigan, jacket], details: [gate_pass, layoff_list], group: mill}
  logging:     {name: in the bush, does: falling for a contractor up island, place: null, ages: [21, 60], m: 9, f: 1, share: 5,
                shifts: [day], tops: [workjacket, flannel, hivis], details: [bar_oil, cork_boots, pitch], group: mill}
  log_truck:   {name: driving logs, does: driving a logging truck, place: null, ages: [26, 64], m: 9, f: 1, share: 3,
                shifts: [day], tops: [flannel, fleece, workjacket], details: [diesel, logbook], group: mill}
  ferry:       {name: on the ferry, does: a deckhand on the ferry, place: ferry_dock, ages: [21, 62], m: 7, f: 3, share: 4,
                shifts: [day, swing], tops: [raincoat, fleece, workjacket], details: [ferry_jacket, salt_boots], group: harbour}
  fishing:     {name: fishing, does: on a boat out of the government wharf, place: govt_wharf, ages: [20, 70], m: 9, f: 1, share: 3,
                shifts: [day], tops: [raincoat, fleece, hoodie], details: [scales, salt_boots, rope_hands], group: harbour}
  nurse:       {name: at the hospital, does: a nurse at the hospital, place: hospital, ages: [23, 64], m: 2, f: 8, share: 4,
                shifts: [day, swing, graveyard], tops: [scrubs], details: [lanyard_turned, compression, pen_hand], group: hospital}
  care_aide:   {name: at the care home, does: a care aide at the care home, place: care_home, ages: [20, 64], m: 2, f: 8, share: 4,
                shifts: [day, swing, graveyard], tops: [scrubs, fleece], details: [lanyard_turned, gloves_powder, sanitizer], group: hospital}
  porter:      {name: at the hospital, does: a porter at the hospital, place: hospital, ages: [20, 60], m: 7, f: 3, share: 1,
                shifts: [day, swing, graveyard], tops: [scrubs, fleece], details: [lanyard_turned, sanitizer], group: hospital}
  teacher:     {name: at the high school, does: teaching at the high school, place: school, ages: [24, 64], m: 4, f: 6, share: 3,
                shifts: [day], tops: [sweater, cardigan, jacket, fleece], details: [red_pen, marking, lanyard_school], group: town}
  esso:        {name: at the Esso, does: on the till at the Esso, place: esso, ages: [19, 66], m: 5, f: 5, share: 2,
                shifts: [day, swing, graveyard], tops: [hoodie, fleece, jacket], details: [esso_vest, scratch_dust], group: strip}
  diner:       {name: at the diner, does: cooking at the diner, place: diner, ages: [19, 66], m: 5, f: 5, share: 3,
                shifts: [day], tops: [hoodie, tshirt, fleece], details: [fryer, burn_wrist, flour], group: strip}
  shop:        {name: on the strip, does: working in the strip mall, place: hardware, ages: [19, 70], m: 4, f: 6, share: 4,
                shifts: [day], tops: [fleece, sweater, jacket, hoodie], details: [price_gun, nails_done, name_tag], group: strip}
  trades:      {name: in the trades, does: framing houses, place: null, ages: [19, 62], m: 9, f: 1, share: 6,
                shifts: [day], tops: [workjacket, hoodie, flannel, hivis], details: [drywall, paint, sawdust_fine, tape_measure], group: trades}
  mechanic:    {name: at the garage, does: a mechanic, place: null, ages: [19, 66], m: 9, f: 1, share: 2,
                shifts: [day], tops: [workjacket, hoodie, flannel], details: [grease, knuckles], group: trades}
  farm:        {name: farming, does: on the farm out the highway, place: null, ages: [19, 80], m: 6, f: 4, share: 2,

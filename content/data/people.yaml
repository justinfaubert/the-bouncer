                shifts: [], tops: [hoodie, jacket, tshirt], details: [laptop_bag, phone_cracked], group: kids}
  out_of_work: {name: out of work, does: out of work since the fish plant, place: null, ages: [24, 62], m: 6, f: 4, share: 4,
                shifts: [], tops: [hoodie, flannel, jacket, fleece], details: [job_paper, smoke_hands], group: strip}
  retired:     {name: retired, does: retired, place: null, ages: [60, 99], m: 5, f: 5, share: 0,
                shifts: [], tops: [cardigan, coat, fleece, flannel, jacket, sweater], details: [poppy, hearing, readers, keys_ring], group: town}

# Retired from what (the old work shows in how they talk and what they wear). By share.
retired_from: {mill: 9, ferry: 2, fishing: 2, nurse: 2, teacher: 2, fish_plant: 3, logging: 2, forces: 2, esso: 1, shop: 2, office_work: 1, care_aide: 1}

# ---------------------------------------------------------------- what he can read off them
#
# One true detail each, what the door can see if it looks (see), and what it means (read). In the
# narration, {his} is his or her or their; {he} and {him} likewise.

details:
  sawdust:        {see: "sawdust packed in the treads of {his} boots", read: "the mill, a shift on the green chain"}
  earplugs:       {see: "a pair of orange foam earplugs on a cord round {his} neck", read: "the mill: the saws"}
  gate_pass:      {see: "a mill gate pass on a lanyard, tucked into {his} collar", read: "the mill, and still working there"}
  cedar:          {see: "the smell of cedar coming off {him}, sharp, like a pencil", read: "the mill: cedar on the saws today"}
  filings:        {see: "steel filings glinting in the hair on the backs of {his} hands", read: "the saw shop at the mill"}
  layoff_list:    {see: "a folded sheet in {his} jacket pocket with a list of names, half of them ticked", read: "the mill office, and the notice"}
  bar_oil:        {see: "bar oil in the creases of {his} hands, the black that never washes out", read: "a chainsaw, every day"}
  cork_boots:     {see: "caulk boots, the steel spikes on the soles, which {he} took off at the step and carried", read: "falling, up island"}
  pitch:          {see: "pitch in {his} hair, a sticky clot of it over one ear", read: "in the bush today"}
  diesel:         {see: "diesel on {his} cuffs, and the hunch of a man who's sat ten hours", read: "driving truck"}
  logbook:        {see: "a driver's logbook sticking out of {his} back pocket", read: "driving logs, on the clock"}
  ferry_jacket:   {see: "a ferry crew jacket under {his} coat, the stripes on the cuffs", read: "on the ferry, and just off it"}
  salt_boots:     {see: "salt dried white in a tideline on {his} boots", read: "the wharf, or a deck"}
  scales:         {see: "fish scales on {his} cuffs, catching the light like sequins", read: "fishing, today"}
  rope_hands:     {see: "rope burn across both {his} palms", read: "a boat, hauling"}
  lanyard_turned: {see: "a hospital ID on a lanyard, turned round backwards so the name doesn't show", read: "the hospital, and done with being found"}
  compression:    {see: "compression socks, the medical kind, showing between {his} shoes and {his} jeans", read: "twelve hours on {his} feet on a ward"}
  pen_hand:       {see: "two pens clipped inside {his} collar and a third behind {his} ear", read: "a nurse, still half on shift"}
  gloves_powder:  {see: "the white of glove powder in the creases of {his} knuckles", read: "care work, gloves on and off all day"}
  sanitizer:      {see: "the hospital smell of hand sanitizer coming off {him}", read: "the hospital or the care home"}
  red_pen:        {see: "red ink on the side of {his} hand, the edge that drags across a page", read: "marking. A teacher"}
  marking:        {see: "a canvas bag of exercise books under {his} arm", read: "a teacher, with marking {he} won't do tonight"}
  lanyard_school: {see: "a school lanyard, the high school's, still round {his} neck", read: "the high school, and {he} forgot it was on"}
  esso_vest:      {see: "the Esso's vest under {his} jacket, the logo showing at the zip", read: "the Esso, a shift just done"}
  scratch_dust:   {see: "silver scratch-ticket dust under {his} thumbnail", read: "the lottery, or the till at the Esso"}
  fryer:          {see: "the fryer on {him}, old oil, in {his} hair and {his} coat", read: "the diner's kitchen"}
  burn_wrist:     {see: "a row of little burns up the inside of {his} wrist, the flat-top's", read: "a cook"}
  flour:          {see: "flour in the seams of {his} jeans", read: "a kitchen, the morning shift"}
  price_gun:      {see: "price stickers stuck to {his} sleeve, three of them, 4.99", read: "a shop on the strip"}
  nails_done:     {see: "{his} nails done tonight, the polish still that wet kind of shine", read: "the salon, or a night out planned"}
  name_tag:       {see: "a name tag still on {his} chest, which {he} hasn't noticed", read: "work, and straight here from it"}
  drywall:        {see: "drywall dust in {his} eyebrows", read: "a house going up, or coming down"}
  paint:          {see: "paint on the backs of {his} hands, eggshell white", read: "painting a house, {his} own or somebody's"}
  sawdust_fine:   {see: "fine sawdust down the front of {his} hoodie, the kind a mitre saw throws", read: "framing, finishing, the trades"}
  tape_measure:   {see: "a tape measure still clipped to {his} belt", read: "the trades, straight off a site"}
  grease:         {see: "grease in the creases of {his} knuckles, scrubbed at and not gone", read: "a garage, engines"}
  knuckles:       {see: "skinned knuckles, both hands, the kind a wrench gives you when it slips", read: "a mechanic"}
  manure:         {see: "manure on {his} boots, scraped off and not all of it", read: "the farms out the highway"}
  hay:            {see: "hay in the turn-ups of {his} jeans", read: "a barn, today"}
  early:          {see: "the yawn of somebody who's been up since four", read: "a farm, or a bakery, or a baby"}
  hivis_town:     {see: "the town's crew vest folded in {his} back pocket, the reflective strips showing", read: "the town's works crew"}
  mud_cuffs:      {see: "clay to the knee, the grey clay that's under this whole town", read: "digging, a ditch or a line"}
  office_shoes:   {see: "office shoes, soaked through, the wrong shoes for here", read: "a desk job, straight here from it"}
  hair_on_sleeve: {see: "cut hair all over {his} sleeves, three or four colours of it", read: "a hairdresser, the end of a long day"}
  laptop_bag:     {see: "a laptop bag {he} won't put down", read: "a student, or wants to look like one"}
  phone_cracked:  {see: "a phone with the screen cracked into a star", read: "dropped it, and can't afford to fix it"}
  job_paper:      {see: "a folded job-board printout in {his} shirt pocket, Alberta jobs circled", read: "out of work, and thinking about leaving"}
  smoke_hands:    {see: "the yellow of a smoker's first two fingers", read: "a pack a day, more lately"}
  poppy:          {see: "a poppy on {his} lapel, pinned through with a Legion pin", read: "the Legion, and November"}
  hearing:        {see: "a hearing aid, the beige kind, whistling a little", read: "the mill, forty years ago, or the guns"}
  readers:        {see: "reading glasses pushed up into {his} hair, forgotten", read: "nothing, except {he} reads"}
  keys_ring:      {see: "a ring of keys the size of a fist, more doors than one person has", read: "the old work still: keys to a church, a hall, a boat"}
  # the teenagers'
  school_bag:     {see: "a gym bag with the high school's crest on it, the team's, and a name on the strap in marker", read: "the high school. Not long out of it, or not out of it yet"}
  mom_calls:      {see: "{his} phone lighting up in {his} hand with MOM, and {him} turning it face down", read: "somebody at home who wants to know where {he} is"}
  gum:            {see: "gum, chewed hard, over something on {his} breath", read: "a drink or two in the truck on the way"}
  all_ages:       {see: "a paper wristband from an all-ages show, the kind they put on you when you can't drink", read: "under nineteen at the last place that checked"}
  big_jacket:     {see: "a jacket that's somebody else's, the sleeves past {his} knuckles", read: "dressed older, in a brother's or a father's coat"}

# What the teenagers have on them instead of a work's details.
teen_details: [school_bag, mom_calls, gum, all_ages, big_jacket, phone_cracked, wet_through]

# Details anyone can have, from what's going on in their life, in place of their work's.
# life: share: how many in a hundred have one of these instead.
life_details:
  share: 22
  list:
    ring_line:     {see: "a pale line on {his} ring finger, and no ring on it", read: "married, or was, till lately", who: {ages: [26, 70]}}
    hospital_band: {see: "a hospital bracelet still on {his} wrist", read: "the hospital, today. A patient, or the one sitting with one"}
    ferry_stub:    {see: "a ferry stub tucked into the band of {his} hat", read: "off the boat from the mainland, tonight"}
    tattoo_wrap:   {see: "plastic wrap taped over a new tattoo on {his} forearm, still weeping ink", read: "a new tattoo, today, and something to mark", who: {ages: [19, 50]}}
    funeral:       {see: "a funeral programme folded in {his} coat pocket, a face on the front", read: "a funeral today"}
    court:         {see: "a suit that doesn't fit, and a court appearance notice sticking out of the pocket", read: "court today, in town", who: {ages: [19, 60]}}
    alberta_plate: {see: "an Alberta plate on the truck {he} just got out of", read: "working away, home for a few days", who: {ages: [22, 55], work: [logging, log_truck, trades, mechanic, out_of_work]}}
    sober_coin:    {see: "a coin {he} keeps turning over in {his} fingers, a sobriety chip", read: "counting days, and here anyway", who: {drink: [dry]}}
    baby_spit:     {see: "a white crust of baby spit on {his} shoulder", read: "a new baby at home, and a night off from it", who: {ages: [22, 42]}}
    rental_skates: {see: "skate laces round {his} neck, rink tape on {his} thumb", read: "the arena, the beer league", who: {ages: [19, 55]}}
    wet_through:   {see: "wet right through, like {he} walked the whole way", read: "no car, or no licence to drive one"}
    lottery:       {see: "a sheaf of lottery tickets bulging in {his} breast pocket", read: "feeling lucky, or needing to", who: {ages: [30, 99]}}

# ---------------------------------------------------------------- how they drink
#
# share: in a hundred adults. regular: how often they're at the Sov (never, rarely, weekends,
# weekly, nightly), as odds. Drunk at the door: how drunk they get there by the late waves.

drink:
  none:   {share: 9,  regular: {never: 8, rarely: 2}}
  dry:    {share: 5,  regular: {never: 5, rarely: 4, weekends: 1}}

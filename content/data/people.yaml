# ---------------------------------------------------------------- the rest of a life
#
# A debt, a grudge, a secret: some of the grown-ups have one of each, made out to someone else in the
# town where it says {other} (their name), in the town's gossip voice, for the voices and the paper
# later. The door doesn't say them; table 28 might. share: how many grown-ups in a hundred have one.
# Each is somebody's once in a town unless times says more. who: only for someone like this (sex,
# ages, drink, work, home, married), other: the one it's made out to has to be married (married), or
# of an age with them (near).

life: {debt: 45, grudge: 35, secret: 60}

debts:
  - {text: "owes {other} eleven hundred dollars for a truck that turned out to have a cracked block"}
  - {text: "owes the pawn shop on a ring, and the ticket runs out on the fifteenth", times: 2}
  - {text: "owes {other} for a hockey bet from the spring, and has been paying it off in rounds", other: near}
  - {text: "owes the credit union three months on the trailer", who: {home: [trailer]}, times: 2}
  - {text: "owes {other} a favour from a night in the lot that nobody's talked about since", other: near}
  - {text: "owes {other} two hundred and forty dollars and a drill"}

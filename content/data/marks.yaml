# Marks: where a voice puts its pen on a printed picture.
#
# When a voice says something about a thing you can see, it can pull that part of the picture out
# and mark it in its own hand: the Fighter rings the big man's hand on the rail, the Manual boxes
# the propped door and labels it, the Wrong Man puts a question mark by the deck door. The detail
# comes up under the line, zoomed in, the mark drawn on as you watch.
#
# A line carries a mark with `mark:` in content/rules/barks.yaml, or a `#mark:` tag on a line in
# the Ink:   mark: pool.lefthand           the spot "lefthand" on the pool table's picture
#            mark: pool.bigman A; pool.buddy B    two spots, each with a word written by it
#
# The spots are in the picture's own measure: 640 across and 220 down, from the top left (render a
# plate with a grid to find them). Each spot has:
#   crop:  [x, y, w, h]     the part of the picture the detail shows (about twice as wide as tall)
#   and one or more shapes, which each voice draws its own way:
#   ring:  [cx, cy, rx, ry]     round something
#   box:   [x, y, w, h]         a box round it
#   line:  [x1, y1, x2, y2]     under it
#   arrow: [x1, y1, x2, y2]     from one point to the other
#   cross: [cx, cy, r]          an X on it
#   tally: [x, y, n]            n strokes, the fifth across
#   note:  [x, y]               where a word written with the mark goes (default: top right of the shape)
#
# Claude's first placement, by eye on the stand-in pictures. If the art changes, the spots move with it.


# Things in the building he can look at when nothing on offer is about them: every object he can
# see, he can reach (bible/11_SKELETON.md). In the Godot build, his eyes on one bring up its name,
# and a click (or E) calls toy_<id>("look") in the Ink (content/ink/things.ink), which says what
# he sees. A voice can answer it (toy:<id>:look in content/rules/barks.yaml). The clock doesn't
# move. When a choice on offer is pinned to the same spot (godot/game/hotspots.gd), the choice
# is what he gets there instead.
#
#   name: the words by it when his eyes are on it
#   at:   where it is in the Godot build's room: a:<anchor> (godot/world/pub.gd), or p:x,y,z
#   from: where he can look at it from, when that's narrower than anywhere he can see it: the
#         places he can be (floor, door, bar, t28, pool, hall, kitchen, keg, deck, lot, upstairs),
#         and room for any of the first five. The room's things are for looking at in the room, not
#         through the window from out in the lot.
#
# Which of them he can see from where is worked out from the building (the part he's in, and the
# openings into the others); godot/tests/reach.gd checks each from every post with a line of sight.
# Claude's drafts, all of it.

# ---------------------------------------------------------------- the room
jukebox: {name: The jukebox., at: a:jukebox, from: [room, hall]}

# People in the Sov on Wednesday.
#
# A doorman tags people by what he sees until he knows their names: HOODIE, HI-VIS, GOOD SHOES.
# So speakers are labelled by those door tags on day 1. When he learns a name, the Ink can
# switch to a second id (not needed yet).
#
#   label     how the speaker is named on screen
#   portrait  art slot in assets.yaml
#   look      until there's art, the face is drawn from parts (src/ui/plates.js):
#               build  slight | medium | big
#               hair   short | buzz | long | bun | ponytail | bald | thin | messy | parted
#                      (long is loose past the shoulders; an old woman's short is set in waves)
#               hat    hood | cap | beanie (a toque) | flatcap | bandana
#               face   a list of: beard, stubble, moustache, glasses, earbuds, hearingaid, lined
#                      (an old woman's glasses are for reading, down her nose, on a chain)
#               top    hoodie | hivis | apron | whites | flannel | suit | coat | jacket | tshirt | cardigan
#                      (a jacket is worn open over a T-shirt; a coat is zipped up)
#               extra  a list of: vape, keys, cigarette, phone, knife, lanyard, mala (dark wooden
#                      beads round the neck), vest (a plain one, over the top)
#               sex    f (leave it out for a man)
#               age    young | old
#               mood   flat | tired | wary | hard | drunk | smile | knowing (how the night sits on them)
#               warm   the mood they wear once he stands well with them (default smile)
#               cold   the mood they wear once he's in their bad books (default hard)
#               group  5 (a table's worth, drawn as one: each of the five from their own look below)
#               ground what's behind them, set by the game from where he is, not here: office,
#                      canopy (the Esso) or dusk (the street, the seawall); none of them has the
#                      sign's red. Left out it's the bar; plain is an ID photo (props.yaml)
#   standing  the group whose opinion of him shows on this face: t28 | kids | staff | cook
#             (rep_<group> in main.ink; at 2 or more they look at him warm, at -2 or less cold)
#   note      for writers; not shown in the game
#
# Everyone here is a draft except where noted. Table 28, the kids, the regulars and the lifer
# bartender are Hutch's (DECIDED); the individual people are Claude's placeholders, to be
# replaced with composites from Hutch's experience.

bartender:
  label: THE BARTENDER
  portrait: bartender
  standing: staff
  look: {build: slight, sex: f, hair: bun, face: [lined], top: apron, extra: [knife], mood: hard, warm: knowing, cold: flat}
  note: The lifer (DECIDED). Draft - a woman in her fifties, at the Sov since she was a server at nineteen. Drinks. Doesn't learn a doorman's name until he's lasted a week.

table28:
  label: TABLE 28
  portrait: table28
  standing: t28
  look: {group: 5}
  note: The hive (DECIDED). Five high-functioning boomer alcoholics, every day but Sunday. One voice most of the time.
team_jacket:
  label: TEAM JACKET
  look: {age: old, hair: thin, top: jacket, mood: smile, warm: drunk}
  note: Table 28. Same jacket every day. The loudest; talks for the table when the table isn't talking as one.
hearing_aid:
  label: HEARING AID
  look: {age: old, hair: bald, top: flannel, face: [hearingaid], cold: wary}
  note: Table 28. Repeats the last word anyone says. Turns the aid down when he disagrees.
scratch:
  label: SCRATCH
  look: {age: old, hat: cap, top: coat, face: [stubble], mood: tired, warm: knowing}
  note: Table 28. Lottery tickets all afternoon. Feeds the rat.
cardigan:
  label: CARDIGAN
  look: {age: old, hair: parted, top: cardigan, cold: wary}
  note: Table 28. The quiet one. Retired from something with a pension.
glasses:
  label: GLASSES
  look: {age: old, hair: short, top: tshirt, face: [glasses, moustache], mood: drunk, warm: drunk}
  note: Table 28. Dennis. His wife comes looking for him.

cook:
  label: THE COOK
  portrait: cook
  standing: cook
  look: {hair: short, face: [stubble], top: tshirt, mood: tired, warm: knowing}
  note: Props the kitchen door because the fryer runs hot. Wants the rats dead because the inspector costs him shifts.

hoodie:
  label: HOODIE
  portrait: hoodie
  standing: kids
  look: {age: young, hat: hood, top: hoodie, face: [earbuds], extra: [phone], mood: wary, warm: flat}
  note: One of the kids (DECIDED group). Nineteen, earbuds, a photo of his ID on his phone. His father is the big man at the pool table (draft).
driver:
  label: THE DRIVER
  portrait: driver
  standing: kids
  look: {sex: f, age: young, hair: ponytail, top: jacket, extra: [keys], mood: hard, warm: knowing, cold: wary}
  note: His sister, twenty-two, sober, the one with the keys. Came to tell their father something (draft).
vape:
  label: VAPE
  portrait: vape
  standing: kids
  look: {age: young, hair: messy, top: hoodie, extra: [vape], mood: drunk, warm: drunk}
  note: The sister's boyfriend. Twenty. Drunk before he got here. The unpredictable one.

bigman:
  label: THE BIG MAN
  portrait: bigman
  look: {build: big, hair: buzz, face: [beard], top: flannel, mood: flat}
  note: At the pool table since before the shift. Playing his buddy for money and letting him win. Left-handed. The kids' father (draft).
buddy:
  label: THE BUDDY
  note: Plays pool with the big man. Small, quick, nervous.

hivis:
  label: HI-VIS
  portrait: hivis
  look: {hat: cap, top: hivis, face: [stubble], mood: tired}
  note: From the work crew renting rooms upstairs on a mill contract. Four beers in, tired.
goodshoes:
  label: GOOD SHOES
  portrait: goodshoes
  look: {hair: parted, top: suit, mood: smile}
  note: In the 86 binder. Polite, sober, well dressed. Says the owner lifted his ban.
raincoat:
  label: RAINCOAT
  note: Glasses' wife, looking for him after midnight.
smoker:
  label: A SMOKER
  note: Claude's draft. Whoever's out on the deck, talking in front of the doorman as if he were a post (deck.ink).
terry:
  label: TERRY
  portrait: terry
  look: {build: slight, hair: thin, face: [glasses], top: flannel, extra: [lanyard], mood: tired}
  note: Claude's draft. The hotel's night clerk, on a stool behind the front desk. Props the hotel door so he can watch the bar's TV. The bartender gives his name (bar.ink).
constable:
  label: THE CONSTABLE
  portrait: constable
  look: {build: medium, sex: f, hair: bun, hat: cap, top: coat, extra: [phone], mood: tired}
  note: Claude's draft. The one car from the detachment in town, forty minutes after the bartender calls it in. Comes only if a fight is called in (pool.ink, ev_police).
endbar:
  label: END OF THE BAR
  portrait: endbar
  look: {hat: flatcap, age: old, face: [lined], top: jacket, mood: knowing}
  note: The man who seems to speak for the rats (DECIDED that such a man exists). Nobody saw him come in. Been coming in longer than the bartender.
owner:
  label: GARY
  note: Gary Van Dusen (DECIDED, Hutch, 14 October), the owner, "Junior" behind his back. The game opens in his office, through his eyes (office.ink); after that he's on the phone. Runs on the money code.
bookkeeper:
  label: THE BOOKKEEPER
  portrait: bookkeeper
  look: {sex: f, age: old, hair: short, face: [glasses], top: cardigan, mood: flat}
  note: At the other desk in Gary's office (Hutch's story 12, bible/12_FROM_THE_DOOR.md). Did his father's books and then his, forty-one years in March; before that a teller at the bank across the road. Her name is Hutch's.
essokid:
  label: THE ESSO KID
  portrait: essokid
  look: {age: young, hat: beanie, top: hoodie, extra: [vest], mood: knowing}
  note: Twenty, on nights at the Esso down the highway (DECIDED, the future machine's eccentric; bible/11_SKELETON.md). Physics on his phone, and four cents an answer rating a machine's for a gig site. On the walk at dusk (walk.ink).
him:
  label: HIM
  portrait: him
  look: {build: big, hair: long, face: [stubble], top: jacket, extra: [mala]}
  note: The doorman, seen once, across Gary's desk (office.ink). He never speaks with a label; his name is Hutch's.
slippers:
  label: SLIPPERS
  note: A resident from upstairs who comes down in her slippers.

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Bouncer</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app" data-state="title">

  <header class="topbar" aria-label="Status">
    <div class="status" data-status="top"></div>
  </header>

  <aside class="rail" id="rail" aria-label="The room and his head">
    <div class="rail-top">
      <div class="rail-grip" aria-hidden="true"></div>
      <button class="rail-close" type="button" data-act="close-rail">Close</button>
    </div>
    <div class="status" data-status="rail"></div>

    <section class="panel-sec" id="sec-floor" aria-labelledby="h-floor">
      <h2 class="sec-h" id="h-floor">The floor</h2>
      <div class="map" id="map"></div>
      <div class="map town" id="town" hidden></div>
      <p class="map-hint" id="map-hint">Tap a lit spot to go there.</p>
    </section>

    <section class="panel-sec" id="sec-head" aria-labelledby="h-head">
      <h2 class="sec-h" id="h-head">In his head</h2>
      <div class="head" id="head"></div>
      <div class="voice-info" id="voice-info" hidden></div>
    </section>

    <section class="panel-sec" id="sec-notes" aria-labelledby="h-notes">
      <h2 class="sec-h" id="h-notes">His notes</h2>
      <div class="him-notes" id="him-notes" hidden></div>
      <ul class="notes" id="notes"></ul>
    </section>

    <footer class="rail-foot">
      <button type="button" class="linkish" data-act="menu">Menu</button>
      <span class="build" id="build-id"></span>
    </footer>
  </aside>

  <main class="story" id="story" aria-live="polite">
    <div class="dir-bar" id="dir-bar" hidden>
      <span class="dir-name">Directing</span>
      <span class="dir-count" data-dir-count></span>
      <span class="dir-acts">
        <button type="button" data-act="dir-back" title="Undo the last choice (B)">Step back</button>
        <button type="button" data-act="dir-desk">Desk</button>
        <button type="button" data-act="dir-off" title="Director mode off (D)" aria-label="Director mode off">Done</button>
      </span>
    </div>
    <div class="story-inner">
      <div class="log" id="log"></div>
      <div class="after" id="after"></div>
    </div>
  </main>

  <!-- his skin, laid over the page: drink, hurt, his heart, the rain on the door's glass (src/ui/skin.js) -->
  <div class="skin" id="skin" aria-hidden="true">
    <div class="sk-hurt"><i></i></div>
    <div class="sk-beat"></div>
    <canvas class="sk-glass"></canvas>
  </div>

  <nav class="tabbar" aria-label="Panels">
    <button type="button" data-act="rail" data-sec="sec-floor">Floor</button>
    <button type="button" data-act="rail" data-sec="sec-head">Head</button>
    <button type="button" data-act="rail" data-sec="sec-notes">Notes</button>
    <button type="button" data-act="menu">Menu</button>
  </nav>

  <!-- the title: the sign on the roof, in the rain -->
  <section class="title" id="title" aria-label="Title">
    <canvas class="rain" id="rain" aria-hidden="true"></canvas>
    <div class="title-inner">
      <div class="sign" role="img" aria-label="The Sovereign Hotel sign. The second E is dead.">
        <div class="sign-name"><span>S</span><span>O</span><span>V</span><span>E</span><span>R</span><span class="dead">E</span><span>I</span><span>G</span><span>N</span></div>
        <div class="sign-hotel">HOTEL</div>
      </div>
      <h1 class="game-name">The Bouncer</h1>
      <p class="game-sub">Wednesday. The test shift.</p>
      <div class="title-menu" id="title-menu"></div>
      <p class="title-note" id="title-note"></p>
    </div>
  </section>

  <!-- dialogs: menu, settings, help, inspector, confirm -->
  <div class="overlay" id="overlay" hidden>
    <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-h"></div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script src="lib/ink.js"></script>
<script src="content.js"></script>
<script src="src/core/util.js"></script>
<script src="src/core/rng.js"></script>
<script src="src/core/checks.js"></script>
<script src="src/core/psyche.js"></script>
<script src="src/core/barks.js"></script>
<script src="src/core/game.js"></script>
<script src="src/core/director.js"></script>
<script src="src/ui/store.js"></script>
<script src="src/ui/audio.js"></script>
<script src="src/ui/views.js"></script>
<script src="src/ui/print.js"></script>
<script src="src/ui/plates.js"></script>
<script src="src/ui/marks.js"></script>
<script src="src/ui/roll.js"></script>
<script src="src/ui/director.js"></script>
<script src="src/ui/hand.js"></script>
<script src="src/ui/props.js"></script>
<script src="src/ui/skin.js"></script>
<script src="src/ui/app.js"></script>
</body>
</html>
